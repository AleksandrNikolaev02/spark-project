services:
  spark-master:
    image: apache/spark:4.2.1-java17
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./lyrics-spark-submit/target:/app:ro
      - ./data:/data:ro

  spark-worker-1:
    image: apache/spark:4.2.1-java17
    container_name: spark-worker-1
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1g
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./lyrics-spark-submit/target:/app:ro
      - ./data:/data:ro

  spark-worker-2:
    image: apache/spark:4.2.1-java17
    container_name: spark-worker-2
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1g
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./lyrics-spark-submit/target:/app:ro
      - ./data:/data:ro